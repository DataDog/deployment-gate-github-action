name: 'Datadog Deployment Gate'
description: 'Evaluate a Datadog deployment gate to ensure deployment quality'
author: 'Datadog'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  service:
    description: 'Name of the service being deployed'
    required: true
  env:
    description: 'Deployment environment (e.g., staging, production)'
    required: true
  version:
    description: 'Version being deployed (required for APM Faulty Deployment Detection rules)'
    required: false
  identifier:
    description: 'Custom identifier for the deployment gate evaluation (defaults to "default")'
    required: false
  primary-tag:
    description: 'Primary tag to scope down APM Faulty Deployment Detection rules analysis (e.g., region:us-central-1)'
    required: false
  scope:
    description: 'Additional scope when retrieving matching rules as key:value pairs (e.g., "region:us-east-1,tier:production")'
    required: false
  tags:
    description: 'Global tags applied to all results as key:value pairs (e.g., "team:backend,service:api")'
    required: false
  dry-run:
    description: 'Run the command without the final evaluation step. All other checks are performed.'
    required: false
    default: 'false'
  fail-if-unavailable:
    description: 'Fail the command if Datadog is unavailable'
    required: false
    default: 'false'
  fail-on-empty:
    description: 'Fail the command if no matching rules are found in Datadog'
    required: false
    default: 'false'
  timeout:
    description: 'Command timeout in seconds'
    required: false
    default: '600'
  no-wait:
    description: 'Remove the waiting time (30s) that ensures events can be properly queried by rules'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install datadog-ci
      shell: bash
      run: npm install -g @datadog/datadog-ci
    
    - name: Run Deployment Gate
      shell: bash
      env:
        DD_BETA_COMMANDS_ENABLED: '1'
      run: |
        # Validate required environment variables
        if [ -z "$DD_API_KEY" ]; then
          echo "❌ Error: DD_API_KEY environment variable is required"
          exit 1
        fi
        
        if [ -z "$DD_APP_KEY" ]; then
          echo "❌ Error: DD_APP_KEY environment variable is required"
          exit 1
        fi
        
        echo "🚀 Starting Datadog Deployment Gate evaluation..."
        echo "Service: ${{ inputs.service }}"
        echo "Environment: ${{ inputs.env }}"
        echo "Datadog Site: ${DD_SITE:-datadoghq.com}"
        
        cmd="datadog-ci deployment gate --service '${{ inputs.service }}' --env '${{ inputs.env }}'"
        
        # Add timeout parameter
        cmd="$cmd --timeout ${{ inputs.timeout }}"
        echo "Timeout: ${{ inputs.timeout }}s"
        
        # Add boolean flags
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          cmd="$cmd --dry-run"
          echo "Dry Run: enabled"
        fi
        
        if [ "${{ inputs.fail-if-unavailable }}" = "true" ]; then
          cmd="$cmd --fail-if-unavailable"
          echo "Fail if Unavailable: enabled"
        fi
        
        if [ "${{ inputs.fail-on-empty }}" = "true" ]; then
          cmd="$cmd --fail-on-empty"
          echo "Fail on Empty: enabled"
        fi
        
        if [ "${{ inputs.no-wait }}" = "true" ]; then
          cmd="$cmd --no-wait"
          echo "No Wait: enabled"
        fi
        
        # Add optional parameters
        if [ -n "${{ inputs.version }}" ]; then
          cmd="$cmd --version '${{ inputs.version }}'"
          echo "Version: ${{ inputs.version }}"
        fi
        
        if [ -n "${{ inputs.identifier }}" ]; then
          cmd="$cmd --identifier '${{ inputs.identifier }}'"
          echo "Identifier: ${{ inputs.identifier }}"
        fi
        
        if [ -n "${{ inputs.primary-tag }}" ]; then
          cmd="$cmd --primary-tag '${{ inputs.primary-tag }}'"
          echo "Primary Tag: ${{ inputs.primary-tag }}"
        fi
        
        # Add scope parameters (convert comma-separated to multiple --scope flags)
        if [ -n "${{ inputs.scope }}" ]; then
          echo "Scope: ${{ inputs.scope }}"
          IFS=',' read -ra SCOPE_ARRAY <<< "${{ inputs.scope }}"
          for scope in "${SCOPE_ARRAY[@]}"; do
            cmd="$cmd --scope '$scope'"
          done
        fi
        
        # Add tags parameters (convert comma-separated to multiple --tags flags)
        if [ -n "${{ inputs.tags }}" ]; then
          echo "Tags: ${{ inputs.tags }}"
          IFS=',' read -ra TAGS_ARRAY <<< "${{ inputs.tags }}"
          for tag in "${TAGS_ARRAY[@]}"; do
            cmd="$cmd --tags '$tag'"
          done
        fi
        
        echo "Executing: $cmd"
        eval "$cmd"
